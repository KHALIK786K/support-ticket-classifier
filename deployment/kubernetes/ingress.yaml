apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketml-api
  namespace: ticketml
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit-rpm: "1200"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ticketml.example.com
      secretName: ticketml-tls
  rules:
    - host: api.ticketml.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketml-api
                port:
                  number: 80
