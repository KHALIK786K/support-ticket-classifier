name: CD - Deploy to AKS

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "notebooks/**"

env:
  AZURE_RESOURCE_GROUP: rg-ticketml-prod
  AKS_CLUSTER: aks-ticketml-prod
  ACR_NAME: ticketmlacr
  IMAGE_NAME: ticketml-api
  K8S_NAMESPACE: ticketml

jobs:
  build-and-deploy:
    name: Build, push & rollout
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write   # OIDC federated cred for Azure login

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login -n ${{ env.ACR_NAME }}

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get AKS credentials
        run: az aks get-credentials -g $AZURE_RESOURCE_GROUP -n $AKS_CLUSTER

      - name: Rolling update
        run: |
          kubectl -n $K8S_NAMESPACE set image \
            deployment/ticketml-api \
            api=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          kubectl -n $K8S_NAMESPACE rollout status deployment/ticketml-api --timeout=5m
